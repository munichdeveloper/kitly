version: '3.8'

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SPRING_DATASOURCE_URL=jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0&preferQueryMode=simple&user=postgres.appsfjcoavulzbxxpcpo
      - SPRING_DATASOURCE_USERNAME=postgres.appsfjcoavulzbxxpcpo
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-dummyPassword}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_FLYWAY_ENABLED=true
      - VIRTUAL_HOST=kitly-backend.controla.dev
      - LETSENCRYPT_HOST=kitly-backend.controla.dev
      - LETSENCRYPT_EMAIL=johannes.hinkov+letsencrypt@gmail.com
      - FRONTEND_URL=${FRONTEND_URL}
      - FRONTEND_APP_URL=${FRONTEND_APP_URL}
      # E-Mail-Verifizierung
      - EMAIL_VERIFICATION_ENABLED=${EMAIL_VERIFICATION_ENABLED:-true}
      - EMAIL_VERIFICATION_TOKEN_VALIDITY_HOURS=${EMAIL_VERIFICATION_TOKEN_VALIDITY_HOURS:-24}
      # E-Mail-Server-Konfiguration
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - APP_EMAIL_FROM=${APP_EMAIL_FROM:-noreply@kitly.com}
      - APP_EMAIL_FROM_NAME=${APP_EMAIL_FROM_NAME:-Kitly}
      # E-Mail-Template-Konfiguration
      - EMAIL_LOCALE=${EMAIL_LOCALE:-de_DE}
      - EMAIL_BRANDING=${EMAIL_BRANDING:-kitly}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-KITLY_MAIL}
      - KITLY_MAIL_API_KEY=${KITLY_MAIL_API_KEY:-change-this-default-api-key}
      - KITLY_MAIL_URL=${KITLY_MAIL_URL:-http://kitly-mail/api/emails}
    networks:
      - auto-proxy
      - kitly-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL}
    expose:
      - "3000"
    environment:
      - VIRTUAL_HOST=kitly.controla.dev
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=kitly.controla.dev
      - LETSENCRYPT_EMAIL=johannes.hinkov+letsencrypt@gmail.com
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - auto-proxy
      - kitly-network

networks:
  kitly-network:
    driver: bridge
  auto-proxy:
    external: true