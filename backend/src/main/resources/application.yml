spring:
  application:
    name: kitly-backend
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kitlydb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  # E-Mail-Konfiguration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    user:
      name: admin
      password: admin

server:
  port: 8080

jwt:
  secret: kitly-secret-key-for-jwt-token-signing-please-change-in-production
  expiration: 86400000 # 24 hours in milliseconds
  session:
    secret: ${JWT_SESSION_SECRET:session-secret-key-for-jwt-token-signing-please-change-in-production}
    expiration: 900000  # 15 minutes in milliseconds

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}


app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000} # NIM Frontend URL
  email:
    from: ${MAIL_FROM:noreply@kitly.com}
    locale: ${EMAIL_LOCALE:de_DE}
    branding: ${EMAIL_BRANDING:kitly}
  email-verification:
    enabled: ${EMAIL_VERIFICATION_ENABLED:false}
    token-validity-hours: ${EMAIL_VERIFICATION_TOKEN_VALIDITY_HOURS:24}

outbox:
  publisher:
    enabled: true
    batch-size: 50
    schedule: "*/10 * * * * *"  # Every 10 seconds

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
