<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitly - {{title}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            line-height: 1.6;
            color: #333333;
            background-color: #f3f4f6;
            padding: 20px;
        }

        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header {
            background-color: #4F46E5;
            padding: 40px 30px;
            text-align: center;
            color: #ffffff;
        }

        .logo {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0;
        }

        .subtitle {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
            margin-top: 8px;
            opacity: 0.9;
        }

        .content {
            padding: 40px 30px;
            background-color: #f9fafb;
        }

        .greeting {
            font-size: 16px;
            color: #111827;
            margin-bottom: 20px;
            font-weight: 600;
        }

        h1 {
            font-size: 24px;
            color: #111827;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }

        h2 {
            font-size: 20px;
            color: #111827;
            margin-bottom: 20px;
            font-weight: 600;
        }

        h3 {
            font-size: 20px;
            color: #111827;
            margin: 30px 0 15px;
            font-weight: 600;
        }

        .text, p {
            font-size: 16px;
            color: #4b5563;
            margin-bottom: 20px;
            line-height: 1.7;
        }

        .button-container {
            text-align: center;
            margin: 35px 0;
        }

        .button {
            display: inline-block;
            padding: 14px 40px;
            background-color: #4F46E5;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .button:hover {
            background-color: #4338CA;
        }

        .button-secondary {
            display: inline-block;
            padding: 14px 40px;
            background-color: #6B7280;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .button-secondary:hover {
            background-color: #4B5563;
        }

        .link-box {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 15px;
            margin: 25px 0;
        }

        .link-label {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .link-url {
            word-break: break-all;
            color: #4F46E5;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            line-height: 1.5;
        }

        .notice, .info-box {
            background-color: #EEF2FF;
            border-left: 4px solid #4F46E5;
            padding: 15px;
            margin: 25px 0;
            border-radius: 4px;
            color: #1e293b;
        }

        .info-box strong {
            color: #111827;
        }

        .notice-text {
            font-size: 14px;
            color: #4b5563;
        }

        .notice-highlight {
            color: #4F46E5;
            font-weight: 600;
        }

        .success-icon {
            text-align: center;
            margin-bottom: 30px;
        }

        .success-icon-circle {
            display: inline-block;
            width: 80px;
            height: 80px;
            background-color: #10b981;
            border-radius: 50%;
            line-height: 80px;
            font-size: 48px;
            color: #ffffff;
        }

        .footer {
            background-color: #f3f4f6;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #e5e7eb;
        }

        .footer-text {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .footer-brand {
            font-size: 14px;
            color: #9ca3af;
            font-weight: 500;
        }

        a {
            color: #4F46E5;
            text-decoration: none;
        }

        strong {
            color: #111827;
        }

        @media only screen and (max-width: 600px) {
            body {
                padding: 10px;
            }

            .header, .content, .footer {
                padding: 25px 20px;
            }

            .greeting {
                font-size: 15px;
            }

            h1, h2 {
                font-size: 20px;
            }

            h3 {
                font-size: 18px;
            }

            .text, p {
                font-size: 15px;
            }

            .button, .button-secondary {
                display: block;
                margin: 10px auto;
                padding: 12px 30px;
                font-size: 15px;
            }

            .success-icon-circle {
                width: 60px;
                height: 60px;
                line-height: 60px;
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="header">
        <div class="logo">Kitly</div>
        <div class="subtitle">{{subtitle}}</div>
    </div>

    <div class="content">
        {{content}}
    </div>

    <div class="footer">
        <p class="footer-text">&copy; 2026 Kitly. {{footerRights}}</p>
    </div>
</div>
</body>
</html>
